name: Idea or feedback
description: How it feels to use, what's confusing, what you'd add.
labels: [feedback, beta]
body:
  - type: textarea
    id: feedback
    attributes:
      label: Your feedback
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options: [Bedtime and listening, Night report, Sleep score, Snoring and sounds, Smart alarm, Nudges, Trends, Settings, Dusk the mascot, Something else]
  - type: dropdown
    id: again
    attributes:
      label: Would you keep using Halcyon?
      options: [Yes, Probably, Not sure, Probably not, No]
